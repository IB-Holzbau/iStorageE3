<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 975" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="975" fill="#f4f1ea"/>

  <!-- Gebäudeblöcke -->
  <g fill="#e2dccf" stroke="#cfc7b6">
    <rect x="0" y="0" width="330" height="270"/>
    <rect x="470" y="0" width="330" height="275"/>
    <rect x="0" y="390" width="315" height="290"/>
    <rect x="505" y="385" width="295" height="295"/>
  </g>

  <!-- Gehwege -->
  <g fill="#cdc7ba">
    <rect x="315" y="330" width="190" height="350"/>
    <rect x="330" y="0" width="140" height="330"/>
    <rect x="0" y="270" width="420" height="120"/>
    <rect x="400" y="275" width="400" height="110"/>
  </g>

  <!-- Fahrbahnen -->
  <g fill="#5b5f66">
    <rect x="340" y="330" width="140" height="350"/>
    <rect x="355" y="0" width="90" height="330"/>
    <rect x="0" y="290" width="420" height="80"/>
    <rect x="400" y="295" width="400" height="70"/>
    <rect x="340" y="290" width="140" height="80"/>
  </g>

  <!-- Markierungen -->
  <g stroke="#ffffff" fill="none">
    <line x1="385" y1="385" x2="385" y2="470" stroke-width="3" stroke-opacity="0.45" stroke-dasharray="40 9 22 14"/>
    <line x1="432" y1="395" x2="432" y2="470" stroke-width="3" stroke-dasharray="10 22" stroke-opacity="0.35"/>
    <line x1="400" y1="0" x2="400" y2="270" stroke-width="3" stroke-dasharray="18 14"/>
    <line x1="0" y1="330" x2="320" y2="330" stroke-width="3" stroke-dasharray="18 14"/>
    <line x1="500" y1="330" x2="800" y2="330" stroke-width="3" stroke-dasharray="18 14"/>
    <!-- Wartelinien der untergeordneten Arme -->
    <line x1="355" y1="238" x2="400" y2="238" stroke-width="8"/>
    <line x1="490" y1="295" x2="490" y2="330" stroke-width="6" stroke-dasharray="8 6"/>
  </g>

  <!-- Verlauf der abknickenden Vorfahrt -->
  <path d="M418 680 L418 385 Q418 310 357 310 L40 310" fill="none" stroke="#f2b705" stroke-width="34" stroke-opacity="0.55"/>
  <path d="M40 310 L70 292 L70 328 Z" fill="#c99400"/>
  <path d="M418 680 L418 385 Q418 310 357 310 L70 310" fill="none" stroke="#c99400" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- Fahrstreifenpfeile -->
  <g fill="#ffffff" fill-opacity="0.35" transform="translate(0 -142)">
    <path d="M404 620 L412 620 L412 568 Q412 556 400 556 L396 556 L396 547 L382 560 L396 573 L396 564 L400 564 Q404 564 404 568 Z"/>
    <path d="M452 620 L460 620 L460 566 L469 566 L456 546 L443 566 L452 566 Z"/>
  </g>

  <!-- Sperrfläche rechts zwischen Haltestelle und Geradeausspur -->
  <defs>
    <pattern id="sperr" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#5b5f66"/>
      <rect width="5" height="12" fill="#ffffff" fill-opacity="0.85"/>
    </pattern>
  </defs>
  <path d="M480 470 L480 545 L440 545 L440 510 Z" fill="url(#sperr)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Bushaltestelle mit Zickzacklinie -->
  <polyline points="466,548 478,560 466,572 478,584 466,596 478,608 466,620" fill="none" stroke="#ffffff" stroke-width="3"/>
  <g transform="translate(493 570)">
    <line x1="0" y1="10" x2="0" y2="40" stroke="#555" stroke-width="3"/>
    <circle r="12" fill="#f2c400" stroke="#2e7d32" stroke-width="3"/>
    <text y="5" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">H</text>
  </g>

  <!-- Parken beidseitig im breiten einspurigen Abschnitt -->
  <g fill="#8c919a" stroke="#ffffff" stroke-width="1.5">
    <rect x="459" y="628" width="19" height="34" rx="4"/>
    <rect x="342" y="560" width="19" height="34" rx="4"/>
    <rect x="342" y="600" width="19" height="34" rx="4"/>
    <rect x="342" y="640" width="19" height="34" rx="4"/>
  </g>

  <!-- Buslinie in beide Richtungen -->
  <g fill="none" stroke="#1f6fb2" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round">
    <path d="M430 675 Q430 625 464 610 L464 560 Q464 515 418 495 L418 390 Q418 300 366 300 L90 300"/>
    <path d="M90 352 L330 352 Q368 352 368 385 L368 662"/>
  </g>
  <path d="M80 300 L96 291 L96 309 Z" fill="#1f6fb2"/>
  <path d="M368 676 L359 660 L377 660 Z" fill="#1f6fb2"/>

  <!-- Bus Richtung Norden an der Haltestelle -->
  <g transform="translate(438 552)">
    <rect x="0" y="0" width="40" height="66" rx="8" fill="#1f6fb2" stroke="#ffffff" stroke-width="2"/>
    <text x="20" y="40" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">BUS</text>
  </g>
  <!-- Bus Richtung Süden -->
  <g transform="translate(345 470)">
    <rect x="0" y="0" width="38" height="62" rx="8" fill="#1f6fb2" stroke="#ffffff" stroke-width="2"/>
    <text x="19" y="37" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">BUS</text>
  </g>

  <!-- Fehlende Querungen -->
  <!-- Geradeausverkehr Süd nach Nord -->
  <path d="M402 665 L402 410 Q402 340 422 300 L422 165" fill="none" stroke="#7a1010" stroke-width="5" stroke-dasharray="14 8"/>
  <path d="M422 145 L410 168 L434 168 Z" fill="#7a1010"/>
  <g transform="translate(422 110)">
    <rect x="-28" y="-15" width="56" height="30" rx="15" fill="#7a1010" stroke="#ffffff" stroke-width="2"/>
    <text y="6" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">50+</text>
  </g>
  <!-- Hauptquerung Gießerstraße Nord, gefährlichste Stelle -->
  <rect x="355" y="246" width="90" height="42" fill="#d62828" fill-opacity="0.3" stroke="#d62828" stroke-width="4" stroke-dasharray="10 5"/>
  <path d="M326 267 L474 267" stroke="#d62828" stroke-width="5" fill="none" stroke-dasharray="6 5"/>
  <path d="M322 267 L336 259 L336 275 Z M478 267 L464 259 L464 275 Z" fill="#d62828"/>
  <!-- Querung Naumburger Straße Ost -->
  <rect x="545" y="295" width="36" height="70" fill="#f28c28" fill-opacity="0.2" stroke="#f28c28" stroke-width="3" stroke-dasharray="9 6"/>
  <path d="M563 272 L563 388" stroke="#f28c28" stroke-width="3" fill="none" stroke-dasharray="4 5"/>
  <!-- Fußgänger an der Hauptquerung -->
  <g transform="translate(262 262)" fill="#d62828">
    <circle cx="0" cy="-22" r="5"/>
    <path d="M-4 -15 L4 -15 L6 0 L10 14 L5 15 L0 3 L-5 15 L-10 14 L-6 0 Z"/>
  </g>
  <g transform="translate(248 272)" fill="#d62828">
    <circle cx="0" cy="-14" r="3.5"/>
    <path d="M-3 -9 L3 -9 L4 1 L6 9 L3 10 L0 3 L-3 10 L-6 9 L-4 1 Z"/>
  </g>

  <!-- Konfliktpunkt -->
  <circle cx="418" cy="332" r="18" fill="#d62828" stroke="#ffffff" stroke-width="3"/>
  <text x="418" y="341" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>

  <!-- Radverkehr -->
  <g stroke="#2a9d8f" stroke-width="3" fill="none" stroke-dasharray="7 5">
    <path d="M466 462 L466 250"/>
    <path d="M466 462 Q466 330 380 330"/>
  </g>
  <path d="M466 236 L457 254 L475 254 Z" fill="#2a9d8f"/>
  <path d="M366 330 L384 321 L384 339 Z" fill="#2a9d8f"/>
  <g transform="translate(440 432)" stroke="#2a9d8f" stroke-width="3" fill="none">
    <circle cx="8" cy="22" r="8"/>
    <circle cx="30" cy="22" r="8"/>
    <path d="M8 22 L16 8 L26 8 L30 22 M16 8 L20 22 L26 8"/>
  </g>

  <!-- Schilder -->
  <!-- Vorfahrtstraße mit Zusatzzeichen abknickende Vorfahrt -->
  <g transform="translate(530 470)">
    <line x1="0" y1="20" x2="0" y2="120" stroke="#555" stroke-width="3"/>
    <rect x="-17" y="3" width="34" height="34" transform="rotate(45 0 20)" fill="#ffffff" stroke="#333" stroke-width="1"/>
    <rect x="-11" y="9" width="22" height="22" transform="rotate(45 0 20)" fill="#f2c400"/>
    <rect x="-20" y="50" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <path d="M0 86 L0 70 L-15 70" stroke="#111" stroke-width="5" fill="none"/>
    <path d="M0 70 L0 55 M0 70 L15 70" stroke="#111" stroke-width="2" fill="none"/>
  </g>
  <!-- Tempo 50 -->
  <g transform="translate(530 640)">
    <line x1="0" y1="0" x2="0" y2="38" stroke="#555" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#d62828" stroke-width="5"/>
    <text x="0" y="7" font-size="18" font-weight="700" fill="#111" text-anchor="middle">50</text>
  </g>
  <!-- Stoppschild Nordarm -->
  <g transform="translate(315 238)">
    <line x1="0" y1="10" x2="0" y2="47" stroke="#555" stroke-width="3"/>
    <path d="M-9 -22 L9 -22 L22 -9 L22 9 L9 22 L-9 22 L-22 9 L-22 -9 Z" fill="#d62828" stroke="#ffffff" stroke-width="2.5"/>
    <text x="0" y="5" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">STOP</text>
  </g>
  <!-- Tempo-30-Zone Ostarm -->
  <g transform="translate(690 200)">
    <line x1="0" y1="30" x2="0" y2="75" stroke="#555" stroke-width="3"/>
    <rect x="-30" y="-36" width="60" height="70" rx="4" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="-10" r="19" fill="#ffffff" stroke="#d62828" stroke-width="5"/>
    <text x="0" y="-3" font-size="17" font-weight="700" fill="#111" text-anchor="middle">30</text>
    <text x="0" y="27" font-size="12" font-weight="700" fill="#111" text-anchor="middle">ZONE</text>
  </g>
  <!-- Tempo 30 Westarm -->
  <g transform="translate(130 425)">
    <line x1="0" y1="0" x2="0" y2="-35" stroke="#555" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#d62828" stroke-width="5"/>
    <text x="0" y="7" font-size="18" font-weight="700" fill="#111" text-anchor="middle">30</text>
  </g>
  <!-- Vorfahrt gewähren Ostarm -->
  <g transform="translate(520 255)">
    <line x1="0" y1="10" x2="0" y2="45" stroke="#555" stroke-width="3"/>
    <path d="M-20 -14 L20 -14 L0 20 Z" fill="#ffffff" stroke="#d62828" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- Nummern -->
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="300" cy="180" r="16" fill="#d62828" stroke="#ffffff" stroke-width="2"/><text x="300" y="186" font-size="17">1</text>
    <circle cx="605" cy="410" r="13" fill="#f28c28"/><text x="605" y="415">2</text>
    <circle cx="456" cy="355" r="13" fill="#d62828"/><text x="456" y="360">3</text>
    <circle cx="494" cy="445" r="13" fill="#2a9d8f"/><text x="494" y="450">4</text>
    <circle cx="494" cy="530" r="13" fill="#1f6fb2"/><text x="494" y="535">5</text>
  </g>

  <!-- Straßennamen -->
  <g font-size="17" font-weight="700" fill="#333">
    <text x="0" y="0" transform="translate(482 20) rotate(90)">Gießerstraße</text>
    <text x="0" y="0" transform="translate(320 640) rotate(-90)">Gießerstraße</text>
    <text x="30" y="282">Naumburger Straße</text>
    <text x="590" y="287">Naumburger Straße</text>
  </g>

  <!-- Nordpfeil -->
  <g transform="translate(750 50)">
    <circle r="24" fill="#ffffff" stroke="#999"/>
    <path d="M0 -17 L9 9 L0 4 L-9 9 Z" fill="#333"/>
    <text y="-28" font-size="13" font-weight="700" text-anchor="middle" fill="#333">N</text>
  </g>

  <!-- Legende -->
  <rect x="0" y="680" width="800" height="295" fill="#ffffff"/>
  <line x1="0" y1="680" x2="800" y2="680" stroke="#cfc7b6" stroke-width="2"/>
  <text x="30" y="718" font-size="20" font-weight="700" fill="#222">Einmündung Gießerstraße / Naumburger Straße, Leipzig-Plagwitz</text>
  <text x="30" y="742" font-size="14" fill="#666">Schematische Darstellung, nicht maßstäblich</text>

  <g font-size="15" fill="#222">
    <rect x="30" y="765" width="40" height="16" fill="#f2b705" fill-opacity="0.55" stroke="#c99400" stroke-dasharray="6 4"/>
    <text x="82" y="778">Abknickende Vorfahrt von Süden nach Westen mit 50 km/h, Naumburger Straße beidseitig Tempo 30</text>

    <circle cx="43" cy="808" r="13" fill="#d62828"/><text x="43" y="813" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="82" y="803" font-weight="700">Gefährlichste und meistgenutzte Querung direkt an der Kreuzung, ohne Sicherung,</text>
    <text x="82" y="821">Geradeausverkehr von Süden fährt mit 50 km/h oder mehr durch</text>

    <circle cx="43" cy="845" r="13" fill="#f28c28"/><text x="43" y="850" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="82" y="850">Stark genutzte Querung über die Naumburger Straße, ohne Sicherung, Verkehr etwas langsamer</text>

    <circle cx="43" cy="878" r="13" fill="#d62828"/><text x="43" y="883" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="82" y="883">Autos fahren aus der Linksabbiegespur geradeaus, Markierung abgefahren</text>

    <circle cx="43" cy="911" r="13" fill="#2a9d8f"/><text x="43" y="916" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="82" y="916">Radverkehr ohne klare Führung beim Abbiegen und Geradeausfahren</text>

    <circle cx="43" cy="944" r="13" fill="#1f6fb2"/><text x="43" y="949" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="82" y="941">Breite einspurige Zufahrt mit Parken, dann Haltestelle und Sperrfläche rechts,</text>
    <text x="82" y="958">Geradeausspur erst kurz vor der Kreuzung, Busse in beide Richtungen</text>
  </g>
</svg>
